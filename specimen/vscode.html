<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Berka Editor Close-Up</title>
  <style>
    @font-face {
      font-family: "Berka Mono Closer";
      src: url("../fonts/woff2/BerkaMonoCloser-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "Berka Mono Closer";
      src: url("../fonts/woff2/BerkaMonoCloser-Bold.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: "Berka Mono Closer Compact";
      src: url("../fonts/woff2-compact/BerkaMonoCloserCompact-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "Berka Mono Closer Compact";
      src: url("../fonts/woff2-compact/BerkaMonoCloserCompact-Bold.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: "Berka Mono Closer SemiCondensed";
      src: url("../fonts/woff2-semi-condensed/BerkaMonoCloserSemiCondensed-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "Berka Mono Closer SemiCondensed";
      src: url("../fonts/woff2-semi-condensed/BerkaMonoCloserSemiCondensed-Bold.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: "Berka Mono Closer Narrow";
      src: url("../fonts/woff2-narrow/BerkaMonoCloserNarrow-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "Berka Mono Closer Narrow";
      src: url("../fonts/woff2-narrow/BerkaMonoCloserNarrow-Bold.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: "Berka Mono Control";
      src: url("../fonts/woff2-control/BerkaMonoControl-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "Berka Mono Control";
      src: url("../fonts/woff2-control/BerkaMonoControl-Bold.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: "Berka Mono Retina";
      src: url("../fonts/woff2-retina/BerkaMonoRetina-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "Berka Mono Retina";
      src: url("../fonts/woff2-retina/BerkaMonoRetina-Bold.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: "Berka Mono Focus";
      src: url("../fonts/woff2-focus/BerkaMonoFocus-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "Berka Mono Focus";
      src: url("../fonts/woff2-focus/BerkaMonoFocus-Bold.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: "Berka Text";
      src: url("../fonts/woff2-text/BerkaText-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "Berka Text";
      src: url("../fonts/woff2-text/BerkaText-Bold.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
    }

    :root {
      color-scheme: dark;
      --editor-font: "Berka Mono Focus";
      --font-size: 31px;
      --line-height: 1.48;
      --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #0f1419;
      --chrome: #151b23;
      --line: #293340;
      --text: #dbe3ec;
      --muted: #788492;
      --blue: #82aaff;
      --green: #c3e88d;
      --yellow: #ffcb6b;
      --orange: #f78c6c;
      --cyan: #89ddff;
      --purple: #c792ea;
      --comment: #727ca8;
      font-family: var(--ui);
      background: #05080c;
      color: var(--text);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 1440px;
      height: 900px;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 4%, rgba(20, 108, 92, 0.24), transparent 34%),
        linear-gradient(135deg, #0b1016, #05080c 72%);
    }

    .stage {
      width: 1440px;
      height: 900px;
      padding: 52px 60px;
    }

    .editor {
      display: grid;
      grid-template-rows: 54px 1fr;
      width: 1320px;
      height: 796px;
      overflow: hidden;
      border: 1px solid #2a3441;
      border-radius: 8px;
      background: var(--bg);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.46);
    }

    .bar {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      border-bottom: 1px solid var(--line);
      background: var(--chrome);
    }

    .tab {
      align-self: stretch;
      display: flex;
      align-items: center;
      width: 360px;
      padding: 0 22px;
      border-right: 1px solid var(--line);
      background: var(--bg);
      color: #d6dee8;
      font-size: 15px;
      font-weight: 700;
    }

    .family {
      padding-right: 22px;
      color: #9aa6b5;
      font-size: 14px;
      font-weight: 700;
    }

    .content {
      display: grid;
      grid-template-columns: 76px 1fr;
      min-height: 0;
      overflow: hidden;
    }

    .gutter,
    .code {
      padding-top: 38px;
      font-family: var(--editor-font), ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: var(--font-size);
      line-height: var(--line-height);
      font-variant-ligatures: contextual common-ligatures;
      tab-size: 2;
    }

    .gutter {
      border-right: 1px solid rgba(38, 49, 61, 0.74);
      color: #536170;
      text-align: right;
      user-select: none;
    }

    .gutter div {
      padding-right: 18px;
    }

    .code {
      overflow: hidden;
      padding-left: 30px;
      color: var(--text);
      white-space: pre;
    }

    .kw { color: var(--purple); }
    .type { color: var(--yellow); }
    .fn { color: var(--blue); }
    .str { color: var(--green); }
    .num { color: var(--orange); }
    .op { color: var(--cyan); }
    .com { color: var(--comment); font-style: italic; }
    .prop { color: #f07178; }
  </style>
</head>
<body>
  <div class="stage">
    <section class="editor">
      <div class="bar">
        <div class="tab" id="tabName">debug-session.ts</div>
        <div class="family" id="familyName">Berka Mono Focus</div>
      </div>
      <div class="content">
        <div class="gutter" id="gutter"></div>
        <pre class="code" id="code"></pre>
      </div>
    </section>
  </div>

  <script>
    const families = {
      closer: {
        name: "Berka Mono Closer",
        label: "Closer",
        ident: "closer",
        file: "font-preview.ts",
        size: "31px"
      },
      compact: {
        name: "Berka Mono Closer Compact",
        label: "Compact",
        ident: "compact",
        file: "compact-layout.ts",
        size: "31px"
      },
      semi: {
        name: "Berka Mono Closer SemiCondensed",
        label: "SemiCondensed",
        ident: "semiCondensed",
        file: "dense-terminal.ts",
        size: "31px"
      },
      narrow: {
        name: "Berka Mono Closer Narrow",
        label: "Narrow",
        ident: "narrow",
        file: "long-lines.ts",
        size: "31px"
      },
      control: {
        name: "Berka Mono Control",
        label: "Control",
        ident: "control",
        file: "control-plane.ts",
        size: "31px"
      },
      retina: {
        name: "Berka Mono Retina",
        label: "Retina",
        ident: "retina",
        file: "retina-render.ts",
        size: "31px"
      },
      focus: {
        name: "Berka Mono Focus",
        label: "Focus",
        ident: "focus",
        file: "debug-session.ts",
        size: "31px"
      },
      text: {
        name: "Berka Text",
        label: "Text",
        ident: "text",
        file: "release-notes.md",
        size: "30px",
        lineHeight: "1.5",
        code: [
          '<span class="kw">#</span> A quieter page for longer thoughts',
          "",
          'Berka Text keeps the rectangular Berka voice, but the rhythm loosens.',
          'Narrow letters get their own space; wide letters stop forcing every',
          'line into the same grid, and paragraphs feel written instead of assembled.',
          "",
          '<span class="kw">##</span> Texture check',
          "",
          'Numbers: <span class="str">0123456789</span>  Ambiguity: <span class="str">0O 1Il rn m</span>',
          'Punctuation: <span class="str">{ } [ ] ( ) @ # $ % &amp; * / \\\\ | ~</span>',
          "",
          '<span class="com">&gt; Good prose type does not disappear by becoming bland.</span>'
        ]
      }
    };

    const baseCode = [
      '<span class="kw">type</span> <span class="type">FontFamily</span> <span class="op">=</span> <span class="str">"__FAMILY__"</span>;',
      "",
      '<span class="kw">export</span> <span class="kw">function</span> <span class="fn">inspect__IDENT__</span>(input: <span class="type">string</span>) {',
      '  <span class="kw">const</span> row_0 <span class="op">=</span> input.<span class="fn">trim</span>().length <span class="op">&gt;=</span> <span class="num">120</span>;',
      '  <span class="kw">const</span> ok <span class="op">=</span> row_0 <span class="op">!==</span> <span class="kw">false</span> <span class="op">&amp;&amp;</span> input <span class="op">!=</span> <span class="kw">null</span>;',
      '  <span class="kw">return</span> ok ? <span class="str">"__LABEL__ =&gt; clear"</span> : <span class="str">"retry -&gt; &lt;="</span>;',
      "}",
      "",
      '<span class="com">// 0O 1Il | rn m nn snake_case kebab-case</span>',
      '<span class="com">// != !== == === &lt;= &gt;= =&gt; -&gt; &lt;- :: |&gt; &amp;&amp;</span>',
      '<span class="kw">const</span> glyphs <span class="op">=</span> <span class="str">"{} [] () @ # $ % &amp; * / \\\\ | ~"</span>;',
      '<span class="kw">export</span> <span class="kw">default</span> { <span class="prop">glyphs</span>, <span class="prop">inspect__IDENT__</span> };'
    ];

    const query = new URLSearchParams(location.search);
    const key = query.get("family") || "focus";
    const family = families[key] || families.focus;
    const sourceCode = family.code || baseCode;
    const code = sourceCode.map(line => line
      .replaceAll("__FAMILY__", family.name)
      .replaceAll("__LABEL__", family.label)
      .replaceAll("__IDENT__", family.ident));

    document.documentElement.style.setProperty("--editor-font", `"${family.name}"`);
    document.documentElement.style.setProperty("--font-size", family.size);
    if (family.lineHeight) {
      document.documentElement.style.setProperty("--line-height", family.lineHeight);
    }
    document.querySelector("#familyName").textContent = family.name;
    document.querySelector("#tabName").textContent = family.file;
    document.querySelector("#code").innerHTML = code.join("\n");
    document.querySelector("#gutter").innerHTML = code.map((_, index) => `<div>${index + 1}</div>`).join("");
  </script>
</body>
</html>
