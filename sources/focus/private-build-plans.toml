# A legally distinct Iosevka custom build tuned as the most practical Berka
# coding cut: high-DPI weight, compact scan density, explicit ambiguous glyphs,
# and syntax-friendly punctuation.

[buildPlans.BerkaMonoFocus]
family = "Berka Mono Focus"
spacing = "normal"
serifs = "sans"
noCvSs = false
noLigation = false
exportGlyphNames = true

[buildPlans.BerkaMonoFocus.variants]
inherits = "ss09"

[buildPlans.BerkaMonoFocus.variants.design]
capital-a = "straight-serifless"
capital-b = "standard-serifless"
capital-d = "more-rounded-serifless"
capital-g = "toothless-corner-serifless-hooked"
capital-i = "short-serifed"
capital-j = "serifed"
capital-k = "straight-serifless"
capital-m = "flat-bottom-serifless"
capital-q = "crossing"
capital-r = "straight-serifless"
capital-w = "straight-flat-top-serifless"
capital-y = "straight-serifless"

a = "double-storey-serifless"
b = "toothless-corner-serifless"
d = "toothed-serifless"
f = "flat-hook-serifless-crossbar-at-x-height"
g = "double-storey"
i = "serifed"
j = "serifed"
k = "straight-serifless"
l = "serifed-flat-tailed"
m = "serifless"
n = "straight-serifless"
p = "earless-corner-serifless"
q = "earless-corner-straight-serifless"
r = "hookless-serifless"
t = "flat-hook"
u = "toothed-serifless"
w = "straight-flat-top-serifless"
y = "straight-serifless"

zero = "oval-long-dotted"
one = "no-base"
two = "straight-neck-serifless"
three = "flat-top-serifless"
four = "open-non-crossing-serifless"
five = "upright-flat-serifless"
six = "straight-bar"
seven = "bend-serifless-crossbar"
eight = "two-circles"
nine = "straight-bar"

asterisk = "penta-low"
brace = "curly-flat-boundary"
paren = "large-contour"
caret = "medium"
dollar = "through"
ampersand = "upper-open"
at = "fourfold"
percent = "rings-continuous-slash"
number-sign = "slanted-open"
underscore = "high"
bar = "force-upright"
question = "corner-flat-hooked"
pilcrow = "low"
lig-ltgteq = "slanted"
lig-neq = "slightly-slanted-dotted"
lig-equal-chain = "without-notch"
lig-hyphen-chain = "without-notch"
lig-plus-chain = "without-notch"
lig-double-arrow-bar = "with-notch"
lig-single-arrow-bar = "with-notch"

[buildPlans.BerkaMonoFocus.ligations]
inherits = "default-calt"
disables = [
  "arrow-wave",
  "counter-arrow-wave",
  "html-comment",
  "trig",
  "tilde-tilde",
  "tilde-tilde-tilde",
]

[buildPlans.BerkaMonoFocus.weights]
Regular = { shape = 425, menu = 400, css = 400 }
Book = { shape = 465, menu = 450, css = 450 }
Medium = { shape = 525, menu = 500, css = 500 }
SemiBold = { shape = 620, menu = 600, css = 600 }
Bold = { shape = 710, menu = 700, css = 700 }

[buildPlans.BerkaMonoFocus.widths]
Normal = { shape = 592, menu = 5, css = "normal" }

[buildPlans.BerkaMonoFocus.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.BerkaMonoFocus.slopes.Italic]
angle = 7
shape = "oblique"
menu = "italic"
css = "italic"

[buildPlans.BerkaMonoFocus.metricOverride]
leading = 1170
winMetricAscenderPad = 0
winMetricDescenderPad = 0
powerlineScaleY = 1.08
powerlineScaleX = 1.0
