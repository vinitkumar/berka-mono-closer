# Ghostty example for Berka Mono Instrument
font-family = "Berka Mono Instrument"
font-family-bold = "Berka Mono Instrument"
font-family-italic = "Berka Mono Instrument"
font-family-bold-italic = "Berka Mono Instrument"
font-size = 15

# Programming ligatures
font-feature = liga
font-feature = calt
font-feature = clig

# Optional: adds a little weight on high-DPI displays
font-thicken = true

# Closer variant:
# font-family = "Berka Mono Closer"
# font-family-bold = "Berka Mono Closer"
# font-family-italic = "Berka Mono Closer"
# font-family-bold-italic = "Berka Mono Closer"

# Focus variant:
# font-family = "Berka Mono Focus"
# font-family-bold = "Berka Mono Focus"
# font-family-italic = "Berka Mono Focus"
# font-family-bold-italic = "Berka Mono Focus"
